<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>حل وتحليل الاختبارات — المعلم الذكي</title><link rel="stylesheet" href="teacher-tools.css"></head><body>
<header><a href="index.html">← الرئيسية</a><strong>حل وتحليل الاختبارات</strong><span></span></header><main class="container"><section class="card"><h2>محلل نموذج الاختبار</h2><p class="muted">ألصق الأسئلة أو النص ثم استخدم التنظيم المحلي.</p><textarea id="input" rows="12" placeholder="1. السؤال الأول...&#10;2. السؤال الثاني..."></textarea><div class="actions"><button onclick="analyze()">تحليل وتنظيم</button><button onclick="copyResult()">نسخ النتيجة</button><button onclick="downloadResult()">تنزيل TXT</button></div></section><section class="card"><h2>النتيجة</h2><div id="result" style="white-space:pre-wrap"></div></section></main><script src="teacher-tools.js"></script><script>let last='';function analyze(){let text=input.value.trim();let lines=text.split(/\n+/).filter(Boolean);let questions=lines.filter(x=>/^\s*(\d+[.)]|[-•])/.test(x));last=`عدد الأسطر: ${lines.length}\nعدد الأسئلة المكتشفة: ${questions.length}\n\nالأسئلة:\n`+(questions.length?questions.map((q,i)=>`${i+1}. ${q.replace(/^\s*(\d+[.)]|[-•])\s*/,'')}`).join('\n'):'لم يتم التعرف على أسئلة مرقمة.');result.textContent=last}async function copyResult(){await navigator.clipboard.writeText(last);alert('تم النسخ')}function downloadResult(){download('exam-analysis.txt',last)}</script></body></html>
