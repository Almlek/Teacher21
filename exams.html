<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>محرر الاختبارات — المعلم الذكي</title><link rel="stylesheet" href="teacher-tools.css"></head><body>
<header><a href="index.html">← الرئيسية</a><strong>محرر الاختبارات</strong><span></span></header><main class="container"><div class="grid"><section class="card"><h2>بيانات الاختبار</h2><input id="title" placeholder="عنوان الاختبار"><select id="type"><option>اختيار من متعدد</option><option>صح وخطأ</option><option>قصير</option></select><textarea id="question" placeholder="نص السؤال"></textarea><textarea id="answer" placeholder="الإجابة النموذجية / الخيارات"></textarea><button onclick="addQ()">إضافة سؤال</button></section><section class="card"><h2>معاينة</h2><div id="preview"></div><div class="actions"><button onclick="print()">طباعة</button><button onclick="exportExam()">تصدير JSON</button></div></section></div></main><script src="teacher-tools.js"></script><script>let qs=load('t21_exam_questions');function render(){preview.innerHTML=`<h2>${esc(title.value||'اختبار جديد')}</h2>`+qs.map((q,i)=>`<div class="card"><b>${i+1}. ${esc(q.q)}</b><p class="muted">${q.type}</p><pre style="white-space:pre-wrap">${esc(q.a)}</pre><button class="danger" onclick="removeQ('${q.id}')">حذف</button></div>`).join('')}function addQ(){if(!question.value.trim())return;qs.push({id:uid(),type:type.value,q:question.value,a:answer.value});save('t21_exam_questions',qs);question.value=answer.value='';render()}function removeQ(id){qs=qs.filter(x=>x.id!==id);save('t21_exam_questions',qs);render()}function exportExam(){download('exam.json',JSON.stringify({title:title.value,questions:qs},null,2),'application/json')}title.oninput=render;render();</script></body></html>
