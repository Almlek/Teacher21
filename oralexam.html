<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>الاختبارات الشفوية — المعلم الذكي</title><link rel="stylesheet" href="teacher-tools.css"></head><body>
<header><a href="index.html">← الرئيسية</a><strong>الاختبارات الشفوية</strong><span></span></header><main class="container"><div class="grid"><section class="card"><h2>إضافة طالب</h2><input id="n" placeholder="اسم الطالب"><button onclick="add()">إضافة</button></section><section class="card"><h2>التقييم</h2><select id="s"></select><input id="grade" type="number" min="0" max="100" placeholder="الدرجة"><textarea id="note" placeholder="ملاحظات"></textarea><button onclick="rate()">حفظ التقييم</button></section></div><section class="card"><h2>نتائج الاختبار الشفوي</h2><table><thead><tr><th>الطالب</th><th>الدرجة</th><th>ملاحظات</th></tr></thead><tbody id="out"></tbody></table></section></main><script src="teacher-tools.js"></script><script>let ss=load('t21_oral_students'),rr=load('t21_oral_results');function render(){s.innerHTML=ss.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('');out.innerHTML=rr.map(r=>{let x=ss.find(z=>z.id===r.sid);return `<tr><td>${esc(x?.name||'')}</td><td>${r.g}</td><td>${esc(r.n)}</td></tr>`}).join('')}function add(){if(!n.value)return;ss.push({id:uid(),name:n.value});save('t21_oral_students',ss);n.value='';render()}function rate(){if(!s.value)return;rr.push({sid:s.value,g:grade.value||0,n:note.value});save('t21_oral_results',rr);grade.value=note.value='';render()}render();</script></body></html>
