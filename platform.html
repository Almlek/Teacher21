<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>المنصة المدرسية — المعلم الذكي</title><link rel="stylesheet" href="teacher-tools.css"></head><body>
<header><a href="index.html">← الرئيسية</a><strong>المنصة المدرسية</strong><span></span></header><main class="container"><div class="grid"><section class="card"><h2>إعلان جديد</h2><input id="annTitle" placeholder="العنوان"><textarea id="annText" placeholder="نص الإعلان"></textarea><button onclick="addAnn()">نشر</button></section><section class="card"><h2>موارد تعليمية</h2><input id="resTitle" placeholder="اسم المورد"><input id="resUrl" placeholder="رابط المورد"><button onclick="addRes()">إضافة</button></section></div><div class="grid"><section class="card"><h2>الإعلانات</h2><div id="anns"></div></section><section class="card"><h2>الموارد</h2><div id="resources"></div></section></div></main><script src="teacher-tools.js"></script><script>let anns=load('t21_anns'),resources=load('t21_resources');function render(){anns.innerHTML=anns.map(x=>`<div class="card"><b>${esc(x.t)}</b><p>${esc(x.x)}</p></div>`).join('')||'<p class="muted">لا توجد إعلانات</p>';resources.innerHTML=resources.map(x=>`<div class="card"><b>${esc(x.t)}</b><p><a href="${esc(x.u)}" target="_blank">فتح المورد</a></p></div>`).join('')||'<p class="muted">لا توجد موارد</p>'}function addAnn(){if(!annTitle.value)return;anns.unshift({t:annTitle.value,x:annText.value});save('t21_anns',anns);annTitle.value=annText.value='';render()}function addRes(){if(!resTitle.value||!resUrl.value)return;resources.unshift({t:resTitle.value,u:resUrl.value});save('t21_resources',resources);resTitle.value=resUrl.value='';render()}render();</script></body></html>
