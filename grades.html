<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>الدرجات والحضور — المعلم الذكي</title><link rel="stylesheet" href="teacher-tools.css"></head><body>
<header><a href="index.html">← الرئيسية</a><strong>الدرجات والحضور</strong><span></span></header><main class="container"><div class="grid"><section class="card"><h2>إضافة طالب</h2><input id="name" placeholder="اسم الطالب"><button onclick="addStudent()">إضافة</button></section><section class="card"><h2>إضافة درجة</h2><select id="student"></select><input id="score" type="number" min="0" max="100" placeholder="الدرجة"><select id="status"><option>حاضر</option><option>غائب</option><option>متأخر</option></select><button onclick="addRecord()">حفظ</button></section></div><section class="card"><div class="actions"><button onclick="exportCSV()">تصدير CSV</button><button class="danger" onclick="clearAll()">مسح البيانات</button></div><h2>سجل الدرجات والحضور</h2><table><thead><tr><th>الطالب</th><th>الدرجة</th><th>الحالة</th><th>إجراء</th></tr></thead><tbody id="rows"></tbody></table></section></main><script src="teacher-tools.js"></script><script>let students=load('t21_students'),records=load('t21_grades');function render(){student.innerHTML=students.map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join('');rows.innerHTML=records.map(r=>{let s=students.find(x=>x.id===r.sid);return `<tr><td>${esc(s?.name||'محذوف')}</td><td>${r.score}</td><td>${r.status}</td><td><button class="danger" onclick="del('${r.id}')">حذف</button></td></tr>`}).join('')}function addStudent(){if(!name.value.trim())return;students.push({id:uid(),name:name.value.trim()});save('t21_students',students);name.value='';render()}function addRecord(){if(!student.value)return;records.push({id:uid(),sid:student.value,score:score.value||0,status:status.value});save('t21_grades',records);render()}function del(id){records=records.filter(x=>x.id!==id);save('t21_grades',records);render()}function clearAll(){if(confirm('مسح جميع السجلات؟')){records=[];save('t21_grades',records);render()}}function exportCSV(){download('grades.csv','الطالب,الدرجة,الحالة\n'+records.map(r=>{let s=students.find(x=>x.id===r.sid);return `"${s?.name||''}",${r.score},${r.status}`}).join('\n'),'text/csv')}render();</script></body></html>
