<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>جدول الحصص — المعلم الذكي</title><link rel="stylesheet" href="teacher-tools.css"></head><body>
<header><a href="index.html">← الرئيسية</a><strong>جدول الحصص</strong><span></span></header><main class="container"><section class="card"><h2>جدول الحصص الأسبوعي</h2><p class="muted">عدّل الخانات ثم اضغط حفظ.</p><div style="overflow:auto"><table id="tbl"></table></div><div class="actions"><button onclick="saveTable()">حفظ الجدول</button><button onclick="clearTable()" class="danger">إعادة تعيين</button></div></section></main><script src="teacher-tools.js"></script><script>const days=['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس'];let data=load('t21_schedule',Array.from({length:5},()=>Array(6).fill('')));function render(){tbl.innerHTML='<tr><th>اليوم</th>'+Array.from({length:6},(_,i)=>`<th>الحصة ${i+1}</th>`).join('')+'</tr>'+days.map((d,i)=>`<tr><th>${d}</th>${data[i].map((v,j)=>`<td><input data-i="${i}" data-j="${j}" value="${esc(v)}" placeholder="المادة"></td>`).join('')}</tr>`).join('')}function saveTable(){document.querySelectorAll('#tbl input').forEach(x=>data[x.dataset.i][x.dataset.j]=x.value);save('t21_schedule',data);alert('تم الحفظ')}function clearTable(){data=Array.from({length:5},()=>Array(6).fill(''));save('t21_schedule',data);render()}render();</script></body></html>
